plugins {
    id 'com.android.application'
}

android {
    namespace 'id.vaultgram.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.vaultgram.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    // Precompiled TDLib JNI for Android (includes org.drinkless.tdlib Java API).
    implementation 'io.github.tdlib-android:core:0.1.1'
}
