name: VaultGram Android CI and Signed Release

on:
  push:
    branches:
      - feature/vaultgram-clean-gallery-signed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VG_VERSION_CODE: ${{ github.run_number + 10000 }}
      VG_VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK (CI test only)
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK (not for long-term updates)
        uses: actions/upload-artifact@v4
        with:
          name: VaultGram-CI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check release signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.VG_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.VG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VG_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VG_KEY_PASSWORD }}
        run: |
          if [[ -z "$KS_B64$KS_PASS$KEY_ALIAS$KEY_PASS" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing not configured; debug compilation completed, no release APK."
          elif [[ -n "$KS_B64" && -n "$KS_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Incomplete signing secrets; set all four values."
            exit 1
          fi
      - name: Prepare signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KS_B64: ${{ secrets.VG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/vaultgram-release.jks"
          test -s "$RUNNER_TEMP/vaultgram-release.jks"
          echo "VG_KEYSTORE_PATH=$RUNNER_TEMP/vaultgram-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          VG_KEYSTORE_PASSWORD: ${{ secrets.VG_KEYSTORE_PASSWORD }}
          VG_KEY_ALIAS: ${{ secrets.VG_KEY_ALIAS }}
          VG_KEY_PASSWORD: ${{ secrets.VG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package:"
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VaultGram-v2-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vaultgram-release.jks"
